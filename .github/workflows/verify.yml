name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The installer branches on process.platform for hook command syntax, so
    # both branches have to actually run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:skills
      - run: npm test

  install-smoke:
    # Proves the published artefact actually installs, not just that the
    # source tree passes its own tests.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: install into a scratch project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scratch/.claude"
          echo '{"model":"claude-opus-5"}' > "$RUNNER_TEMP/scratch/.claude/settings.json"
          cd "$RUNNER_TEMP/scratch"
          node "$GITHUB_WORKSPACE/bin/harness.js" install --profile strict
          node "$GITHUB_WORKSPACE/bin/harness.js" doctor

      - name: pre-existing config must survive
        shell: bash
        run: |
          cd "$RUNNER_TEMP/scratch"
          grep -q 'claude-opus-5' .claude/settings.json

      # Exit code alone proves nothing: a hook the shell cannot parse still exits
      # 0. Run the installed command through bash and require the hook's output.
      - name: installed hooks actually execute
        shell: bash
        run: |
          cd "$RUNNER_TEMP/scratch"
          CMD=$(node -e "const s=require('./.claude/settings.json');console.log(s.hooks.SessionStart.flatMap(g=>g.hooks).find(h=>h.command.includes('learning-hook')).command)")
          echo "hook command: $CMD"
          OUT=$(echo '{"context_tokens":400000}' | CLAUDE_PROJECT_DIR="$PWD" bash -c "$CMD")
          echo "$OUT"
          echo "$OUT" | grep -q '\[context\]'

      - name: uninstall leaves no harness hooks behind
        shell: bash
        run: |
          cd "$RUNNER_TEMP/scratch"
          node "$GITHUB_WORKSPACE/bin/harness.js" uninstall
          ! grep -q 'riyans-claude-skills' .claude/settings.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: verify the tarball contains what it claims
        run: |
          npm pack --dry-run
          npm pack --dry-run --json > pack.json
          node -e "
            const p = require('./pack.json')[0];
            const files = p.files.map(f => f.path);
            // The hook lives under a dot-directory, which npm handles only
            // because package.json lists it explicitly. Guard that.
            const need = [
              'bin/harness.js',
              'skills/token-harness/SKILL.md',
              'LICENSE',
              '.claude/helpers/learning-hook.cjs',
            ];
            const missing = need.filter(n => !files.includes(n));
            if (missing.length) { console.error('missing from tarball:', missing); process.exit(1); }
            console.log('tarball ok:', files.length, 'files,', p.size, 'bytes');
          "
