name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The installer branches on process.platform for hook command syntax, so
    # both branches have to actually run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run lint:skills
      - run: npm test

  install-smoke:
    # Proves the published artefact actually installs, not just that the
    # source tree passes its own tests.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev

      - name: install into a scratch project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scratch/.claude"
          echo '{"model":"claude-opus-5"}' > "$RUNNER_TEMP/scratch/.claude/settings.json"
          cd "$RUNNER_TEMP/scratch"
          node "$GITHUB_WORKSPACE/bin/harness.js" install --profile strict
          node "$GITHUB_WORKSPACE/bin/harness.js" doctor

      - name: pre-existing config must survive
        shell: bash
        run: |
          cd "$RUNNER_TEMP/scratch"
          grep -q 'claude-opus-5' .claude/settings.json

      # Exit code alone proves nothing: a hook the shell cannot parse still exits
      # 0. Run the installed command through bash and require the hook's output.
      - name: installed hooks actually execute
        shell: bash
        run: |
          cd "$RUNNER_TEMP/scratch"
          CMD=$(node -e "const s=require('./.claude/settings.json');console.log(s.hooks.SessionStart.flatMap(g=>g.hooks).find(h=>h.command.includes('learning-hook')).command)")
          echo "hook command: $CMD"
          OUT=$(echo '{"context_tokens":600000}' | CLAUDE_PROJECT_DIR="$PWD" bash -c "$CMD")
          echo "$OUT"
          echo "$OUT" | grep -q '\[context\]'

      - name: uninstall leaves no harness hooks behind
        shell: bash
        run: |
          cd "$RUNNER_TEMP/scratch"
          node "$GITHUB_WORKSPACE/bin/harness.js" uninstall
          ! grep -q 'riyans-claude-skills' .claude/settings.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev
      - name: verify the tarball contains what it claims
        run: |
          npm pack --dry-run
          npm pack --dry-run --json > pack.json
          node -e "
            const p = require('./pack.json')[0];
            const files = p.files.map(f => f.path);
            // The hook lives under a dot-directory, which npm handles only
            // because package.json lists it explicitly. Guard that.
            const need = [
              'bin/harness.js',
              'skills/token-harness/SKILL.md',
              'LICENSE',
              '.claude/helpers/learning-hook.cjs',
              'agents/rc-haiku.md',
            ];
            const missing = need.filter(n => !files.includes(n));
            if (missing.length) { console.error('missing from tarball:', missing); process.exit(1); }
            console.log('tarball ok:', files.length, 'files,', p.size, 'bytes');
          "

  npx-oneliner:
    # The README's first command, run exactly as a stranger would: fetched from
    # GitHub by npx with no checkout, on every OS, against a sample transcript.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 18 and 22 bundle different npm majors, and npx is npm.
        node: ['18', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: a session re-sent after a 3-hour break
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cfg/projects/sample"
          cat > "$RUNNER_TEMP/cfg/projects/sample/s1.jsonl" <<'JSONL'
          {"type":"assistant","requestId":"r1","timestamp":"2026-09-16T10:00:00Z","message":{"model":"us.anthropic.claude-sonnet-4-5-20250929-v1:0","content":[{"type":"text","text":"ok"}],"usage":{"input_tokens":0,"cache_read_input_tokens":0,"cache_creation_input_tokens":400000,"cache_creation":{"ephemeral_1h_input_tokens":400000,"ephemeral_5m_input_tokens":0},"output_tokens":100}}}
          {"type":"assistant","requestId":"r2","timestamp":"2026-09-16T13:00:00Z","message":{"model":"us.anthropic.claude-sonnet-4-5-20250929-v1:0","content":[{"type":"text","text":"ok"}],"usage":{"input_tokens":0,"cache_read_input_tokens":0,"cache_creation_input_tokens":400000,"cache_creation":{"ephemeral_1h_input_tokens":400000,"ephemeral_5m_input_tokens":0},"output_tokens":100}}}
          JSONL
      - name: npx github spend
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/cfg
        run: |
          # A short hash: npm 10 fails a github: spec pinned to a full 40-character
          # hash ("GitFetcher requires an Arborist constructor"), though the README's
          # unpinned spec, #main and short hashes all work. Found by this job.
          OUT=$(npx --yes "github:${GITHUB_REPOSITORY}#${GITHUB_SHA::12}" spend)
          echo "$OUT"
          # 400k tokens re-written at Sonnet 4.5's 1-hour rate ($6/M) is $2.40,
          # less a fresh 56k session ($0.34): priced, so the Bedrock id resolved.
          echo "$OUT" | grep -q 'Nothing is sent anywhere'
          echo "$OUT" | grep -q '\$2\.06 (.*) re-sent a whole cached session after a break, once\.'
          echo "$OUT" | grep -q 'claude plugin install rcskills@riyans-claude-skills'
